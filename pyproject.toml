[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "samuelriss-checklist"
version = "0.1.0"
description = "从样本里推断变更评审的检查项应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "samuelriss" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://samuelriss.github.io"
Repository = "https://github.com/samuelriss/checklist"
Issues = "https://github.com/samuelriss/checklist/issues"

[project.scripts]
checklist = "checklist:main"

[tool.setuptools]
py-modules = ["checklist"]
